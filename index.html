<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Frame</title>
<style>
@font-face { font-family:"Jost"; src:url("fonts/jost3.woff2?v=4") format("woff2"); font-weight:100 900; font-display:swap; }
* { margin:0; padding:0; box-sizing:border-box; -webkit-user-select:none; user-select:none; }
html,body { width:100%; height:100%; background:#000; overflow:hidden; font-family:"Jost",sans-serif; }
#app, #app * { transition: color 1.5s ease, background-color 1.5s ease, border-color 1.5s ease, text-shadow 1.5s ease; }

/* ---------- canvas scene ---------- */
#scene { position:absolute; inset:0; }
#scrim { position:absolute; inset:0; background:linear-gradient(180deg, rgba(2,8,20,.30) 0%, rgba(2,8,20,.12) 45%, rgba(2,8,20,.35) 100%); }
#vignette { position:absolute; inset:0; pointer-events:none; background:radial-gradient(ellipse at center, rgba(0,0,10,0) 55%, rgba(0,0,10,.32) 100%); }

/* ---------- layout ---------- */
#app { position:absolute; inset:0; display:flex; flex-direction:column; padding:2.5vh 3.5vw; color:#fff; }
.lbl { letter-spacing:.26em; color:#8fd2ff; font-weight:500; text-transform:uppercase; }

/* header block: time and temp evenly distributed */
#hdr { flex:1; display:flex; align-items:center; }
#timeBlock { flex:1; text-align:center; }
#time { font-size:28vh; font-weight:300; line-height:.95; text-shadow:0 3px 22px rgba(0,0,10,.35); }
#time small { font-size:7.5vh; font-weight:300; margin-left:1vw; color:rgba(255,255,255,.9); }
#date { font-size:5vh; font-weight:300; letter-spacing:.3em; color:rgba(255,255,255,.95); text-transform:uppercase; margin-top:1vh; }
#condBox { flex:1; text-align:center; }
#condTempRow { display:flex; align-items:center; justify-content:center; gap:2vw; }
#condTemp { font-size:22vh; font-weight:300; line-height:1; text-shadow:0 3px 18px rgba(0,0,10,.3); }
#condIcon { width:26vh; height:18vh; }
#condFeels { font-size:3.4vh; font-weight:300; color:rgba(255,255,255,.75); margin-top:.4vh; }
#condTxt { font-size:5.5vh; letter-spacing:.2em; font-weight:300; margin-top:.5vh; }
#condWind { font-size:3.8vh; font-weight:300; color:rgba(255,255,255,.85); margin-top:.5vh; }

/* bottom strip: tides | moon | sun */
#strip { flex:none; height:33vh; background:linear-gradient(180deg, rgba(8,18,32,.34) 0%, rgba(8,18,32,.16) 100%); border:1px solid rgba(255,255,255,.12);
  border-radius:16px;
  display:flex; align-items:center; color:#fff; overflow:hidden; }
.pane { flex:1; display:flex; align-items:center; justify-content:center; padding:0 1vw; }
#tidePane { flex-direction:column; align-items:center; justify-content:center; gap:1vh; }
#tideLbl { font-size:2.1vh; letter-spacing:.2em; color:#8fd2ff; font-weight:500; text-transform:uppercase; text-align:center; }
#tideWave { width:100%; height:12vh; display:block; }
#tideCap { font-size:2.7vh; font-weight:300; white-space:nowrap; overflow:hidden; text-align:center; text-shadow:0 1px 8px rgba(0,0,10,.7); }
#tideLbl, #moonName, #moonRise, #moonLit, .plbl, #sunPane .srow, #sunPane .srow span.k { text-shadow:0 1px 8px rgba(0,0,10,.6); }
#tideCap .next { color:#8fd2ff; }
#tideCap .dim { color:rgba(255,255,255,.6); }
.stripDiv { width:1px; align-self:stretch; background:rgba(255,255,255,.15); margin:1.4vh 0; }
#moonPane { gap:1.6vw; }
#moonIcon { width:14vh; height:14vh; flex:none; }
#moonPane .mtext { text-align:left; }
#moonName { font-size:3.1vh; font-weight:300; }
#moonRise { font-size:2.5vh; color:rgba(255,255,255,.7); margin-top:.3vh; white-space:nowrap; }
#moonLit { font-size:2.3vh; color:rgba(255,255,255,.55); margin-top:.2vh; white-space:nowrap; }
#moonPane .plbl { font-size:2vh; letter-spacing:.2em; color:#8fd2ff; font-weight:500; text-transform:uppercase; }
#sunPane { flex-direction:column; justify-content:center; gap:2.2vh; text-align:center; }
#sunPane .srow { display:flex; align-items:center; justify-content:center; gap:1.2vw; font-size:4.2vh; font-weight:300; }
#sunPane .srow svg { width:6vh; height:4.2vh; }
#sunPane .srow span.k { font-size:2.8vh; color:#8fd2ff; letter-spacing:.14em; width:10vw; text-align:left; }

#music { position:absolute; top:1vh; right:1vw; width:7vw; height:7vw; display:none; align-items:center; justify-content:center;
  font-size:3.6vh; color:rgba(255,255,255,.5); cursor:pointer; z-index:50; }
#settingsGear { position:absolute; bottom:0; left:0; width:7vw; height:7vw; z-index:50; opacity:0; }
#panel { position:absolute; inset:0; background:rgba(5,10,18,.97); color:#ddd; z-index:100; display:none; padding:3vh 4vw; overflow-y:auto; font-size:2.4vh; }
#panel.open { display:block; }
#panel h2 { font-size:3vh; font-weight:400; margin-bottom:1.5vh; color:#fff; }
#panel label { display:block; margin:1vh 0 .2vh; color:#999; font-size:2vh; }
#panel input, #panel select { background:#141c28; color:#eee; border:1px solid #2a3a4e; border-radius:6px; padding:.8vh 1vw; font-size:2.2vh; width:60%; }
#panel .row { display:flex; gap:3vw; } #panel .row > div { flex:1; }
#panel button { background:#2a6fb5; border:0; color:#fff; border-radius:6px; padding:1.2vh 2.5vw; font-size:2.4vh; margin-top:1.5vh; }
#panel .close { position:absolute; top:1.5vh; right:2.5vw; font-size:3.4vh; color:#999; cursor:pointer; }

/* ---------- night: same layout, red on black ---------- */
body.night #scene, body.night #scrim, body.night #vignette { display:none; }
body.night { background:#000; }
body.night .card { background:#000; border-color:rgba(130,30,30,.35); backdrop-filter:none; -webkit-backdrop-filter:none; }
body.night #time { color:#a52424; text-shadow:0 0 14px rgba(150,25,25,.35); }
body.night #time small { color:#7a1616; text-shadow:none; }
body.night #date { color:#5c1010; }
body.night #condTemp { color:#962020; text-shadow:0 0 10px rgba(150,25,25,.3); }
body.night #condTxt { color:#6b1414; }
body.night #condWind { color:#4a0d0d; }
body.night .lbl, body.night .plbl, body.night #tideLbl { color:#6b1414; }
body.night #tideCap { color:#7a1616; }
body.night #tideCap .next { color:#a52424; }
body.night #tideCap .dim { color:#4a0d0d; }
body.night #tideWave path { stroke:#a52424 !important; fill:none !important; }
body.night #tideWave path:first-of-type { fill:rgba(150,30,30,.14) !important; }
body.night #tideWave line { stroke:rgba(140,30,30,.4) !important; }
body.night #tideWave circle { fill:#c04040 !important; }
body.night #moonIcon { filter:grayscale(1) brightness(.4) sepia(1) hue-rotate(-45deg) saturate(4); opacity:.9; }
body.night #condIcon { filter:grayscale(1) brightness(.45) sepia(1) hue-rotate(-45deg) saturate(4); opacity:.85; }
#condIcon svg { width:100%; height:100%; display:block; }
body.night #sunRow svg *, body.night #sunPane svg * { stroke:#5c1010 !important; fill:none !important; }
body.night .srow span.k, body.night .srow { color:#6b1414; }
body.night #sunriseT, body.night #sunsetT { color:#962020; }
body.night #music { color:#4a0d0d; }
#nightWrap { display:none !important; }
</style>
</head>
<body>
  <canvas id="scene"></canvas>
  <div id="scrim"></div>
  <div id="vignette"></div>

  <div id="app">
    <div id="hdr">
      <div id="timeBlock">
        <div id="time">--:--<small></small></div>
        <div id="date"></div>
      </div>
      <div id="condBox">
        <div id="condTempRow"><span id="condIcon"></span><span id="condTemp">--°</span></div>
        <div id="condTxt"></div>
        <div id="condWind"></div>
        <div id="condFeels"></div>
      </div>
    </div>

    <div id="strip">
      <div class="pane" id="tidePane">
        <div id="tideLbl">Tides — Barnegat Inlet</div>
        <div id="tideWave"></div>
        <div id="tideCap"></div>
      </div>
      <div class="stripDiv"></div>
      <div class="pane" id="moonPane">
        <svg id="moonIcon" viewBox="0 0 100 100"></svg>
        <div class="mtext">
          <div class="plbl">Moon</div>
          <div id="moonName"></div>
          <div id="moonRise"></div>
          <div id="moonLit"></div>
        </div>
      </div>
      <div class="stripDiv"></div>
      <div class="pane" id="sunPane">
        <div class="srow"><svg viewBox="0 0 100 70"><g stroke="#ffb340" stroke-width="6" stroke-linecap="round" fill="none"><path d="M20 48 h60"/><path d="M35 38 a15 15 0 0 1 30 0"/><line x1="50" y1="14" x2="50" y2="22"/><line x1="26" y1="24" x2="32" y2="30"/><line x1="74" y1="24" x2="68" y2="30"/></g></svg><span class="k">Sunrise</span><span id="sunriseT"></span></div>
        <div class="srow"><svg viewBox="0 0 100 70"><g stroke="#ff8a3d" stroke-width="6" stroke-linecap="round" fill="none"><path d="M20 44 h60"/><path d="M35 34 a15 15 0 0 1 30 0" opacity=".9"/><line x1="24" y1="58" x2="30" y2="52"/><line x1="76" y1="58" x2="70" y2="52"/></g></svg><span class="k">Sunset</span><span id="sunsetT"></span></div>
      </div>
    </div>
  </div>

  <div id="nightWrap">
    <div id="flipClock"></div>
    <div id="nightTemp"></div>
  </div>

  <div id="music">&#9835;</div>
  <input id="settingsGear" type="image" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="settings">
  <div id="panel">
    <span class="close">&#10005;</span>
    <h2>Settings</h2>
    <label>Schedule mode</label>
    <select id="sMode"><option value="sun">Sunrise / sunset</option><option value="fixed">Fixed times</option><option value="off">Always day</option></select>
    <div class="row">
      <div><label>Day starts (HH:MM, fixed mode)</label><input id="sDayStart" type="time"></div>
      <div><label>Day ends (HH:MM, fixed mode)</label><input id="sDayEnd" type="time"></div>
    </div>
    <label>Sunset + minutes (day stays on this long past sunset)</label><input id="sSunsetOffset" type="number" min="0" max="300">
    <div class="row">
      <div><label>Latitude</label><input id="sLat" type="text"></div>
      <div><label>Longitude</label><input id="sLon" type="text"></div>
    </div>
    <label>NOAA tide station ID</label><input id="sTideStation" type="text">
    <label>Radio stream URL (blank = hidden)</label><input id="sStream" type="text">
    <button id="sSave">Save</button>
    <p id="credits">Weather: Open-Meteo. Tides: NOAA CO-OPS. Weather icons: Meteocons by Bas Milius (basmilius.github.io). Sky and scenery rendered locally.</p>
  </div>
<script src="js/lottie_light.min.js?v=4"></script>
<script src="photos.js?v=4"></script>
<script>
"use strict";
var DEFAULTS = { mode:"sun", dayStart:"07:00", dayEnd:"20:00", sunsetOffset:120, sunriseOffset:0,
  lat:"39.7518", lon:"-74.2585", tideStation:"8533615", stream:"" };
var S = {};
try { S = JSON.parse(localStorage.getItem("frameSettings") || "{}"); } catch(e) { S = {}; }
for (var k in DEFAULTS) if (!(k in S)) S[k] = DEFAULTS[k];
function save(){ localStorage.setItem("frameSettings", JSON.stringify(S)); }
var $ = function(id){ return document.getElementById(id); };

/* ============ animated weather icons (Meteocons by Bas Milius) ============ */
var iconAnim = null, currentIconName = null;
function iconName(code, isDay){
  var c = code||0, d = isDay ? "day" : "night";
  if (c<=1) return "clear-"+d;
  if (c===2) return "partly-cloudy-"+d;
  if (c===3) return "overcast-"+d;
  if (c===45||c===48) return "fog-"+d;
  if (c===51||c===53||c===55) return "drizzle";
  if (c===66||c===67) return "sleet";
  if ((c>=71&&c<=77)||c===85||c===86) return "snow";
  if (c===95||c===96||c===99) return "thunderstorms-"+d;
  return "rain";
}
function showIcon(code, isDay){
  var name = iconName(code, isDay);
  if (name === currentIconName || !window.lottie) return;
  currentIconName = name;
  if (iconAnim) { try { iconAnim.destroy(); } catch(e){} iconAnim = null; }
  var el = $("condIcon");
  el.innerHTML = "";
  iconAnim = lottie.loadAnimation({ container: el, renderer: "svg", loop: true, autoplay: true, path: "icons/" + name + ".json?v=4" });
}

/* ============ weather ============ */
var W = null;
function fetchWx(){
  var u = "https://api.open-meteo.com/v1/forecast?latitude="+S.lat+"&longitude="+S.lon
    +"&current=temperature_2m,apparent_temperature,is_day,weather_code,wind_speed_10m,wind_direction_10m,wind_gusts_10m"
    +"&daily=sunrise,sunset,moon_phase,moonrise,moonset"
    +"&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=auto&forecast_days=2";
  fetch(u).then(function(r){ return r.json(); }).then(function(d){
    W = d; renderWx(); Scene.update(W); tick();
  }).catch(function(){});
}
function compass(deg){ var pts=["N","NNE","NE","ENE","E","ESE","SE","SSE","S","SSW","SW","WSW","W","WNW","NW","NNW"]; return pts[Math.round(deg/22.5)%16]; }
function to12(iso){ var d = iso instanceof Date ? iso : new Date(iso); var h=d.getHours()%12||12, m=("0"+d.getMinutes()).slice(-2); return h+":"+m; }
function moonName(p){
  if (p<.03||p>.97) return "New Moon"; if (p<.22) return "Waxing Crescent"; if (p<.28) return "First Quarter";
  if (p<.47) return "Waxing Gibbous"; if (p<.53) return "Full Moon"; if (p<.72) return "Waning Gibbous";
  if (p<.78) return "Last Quarter"; return "Waning Crescent";
}
var MOON_ID = 0;
function litPath(p,R,cx,cy,waxing,gib){
  var top=cy-R, bot=cy+R;
  if (p>=.97) { return "M "+(cx-R)+" "+cy+" a "+R+" "+R+" 0 1 0 "+(2*R)+" 0 a "+R+" "+R+" 0 1 0 "+(-2*R)+" 0"; }
  var rx = Math.abs(Math.cos(2*Math.PI*p))*R;
  var d = waxing ? "M "+cx+" "+top+" A "+R+" "+R+" 0 0 1 "+cx+" "+bot
                 : "M "+cx+" "+top+" A "+R+" "+R+" 0 0 0 "+cx+" "+bot;
  d += " A "+rx+" "+R+" 0 0 "+(gib ? (waxing?1:0) : (waxing?0:1))+" "+cx+" "+top;
  return d;
}
function moonSVG(p, uid){
  var R=44, cx=50, cy=50;
  var waxing = p<.5, gib = p>.25 && p<.75;
  var id = uid || ("m"+(MOON_ID++));
  var out = '<defs>'
    + '<radialGradient id="g'+id+'" cx="35%" cy="32%" r="80%"><stop offset="0" stop-color="#eef2f7"/><stop offset=".65" stop-color="#c3ccd9"/><stop offset="1" stop-color="#96a2b3"/></radialGradient>'
    + '<clipPath id="c'+id+'"><path d="'+litPath(p,R,cx,cy,waxing,gib)+'"/></clipPath>'
    + '</defs>';
  out += '<circle cx="'+cx+'" cy="'+cy+'" r="'+R+'" fill="#141b26" stroke="rgba(255,255,255,.22)" stroke-width="1.5"/>';
  if (p>=.97) {
    out += '<circle cx="'+cx+'" cy="'+cy+'" r="'+R+'" fill="url(#g'+id+')"/>';
  } else if (p<=.03) {
    /* dark */
  } else {
    out += '<g clip-path="url(#c'+id+')">'
      + '<circle cx="'+cx+'" cy="'+cy+'" r="'+R+'" fill="url(#g'+id+')"/>'
      + '<circle cx="62" cy="38" r="9" fill="rgba(105,115,132,.38)"/>'
      + '<circle cx="43" cy="60" r="7" fill="rgba(105,115,132,.34)"/>'
      + '<circle cx="66" cy="62" r="5.5" fill="rgba(105,115,132,.3)"/>'
      + '<circle cx="36" cy="36" r="4.5" fill="rgba(105,115,132,.3)"/>'
      + '<circle cx="55" cy="47" r="3.5" fill="rgba(105,115,132,.28)"/>'
      + '<circle cx="70" cy="47" r="3" fill="rgba(105,115,132,.26)"/>'
      + '</g>';
  }
  return out;
}
function wxName(c){
  var m={0:"Clear",1:"Mostly clear",2:"Partly cloudy",3:"Overcast",45:"Fog",48:"Fog",51:"Drizzle",53:"Drizzle",55:"Drizzle",61:"Rain",63:"Rain",65:"Heavy rain",66:"Sleet",67:"Sleet",71:"Snow",73:"Snow",75:"Heavy snow",77:"Snow",80:"Showers",81:"Showers",82:"Heavy showers",85:"Snow",86:"Snow",95:"Thunderstorm",96:"Storms",99:"Storms"};
  return m[c]||"";
}
function renderWx(){
  if (!W) return;
  var c = W.current, isDay = c.is_day===1;
  $("condTemp").textContent = Math.round(c.temperature_2m)+"°";
  $("condTxt").textContent = wxName(c.weather_code);
  showIcon(c.weather_code, isDay);
  $("condWind").textContent = compass(c.wind_direction_10m)+" "+Math.round(c.wind_speed_10m)+" mph · Gusts "+Math.round(c.wind_gusts_10m);
  $("condFeels").textContent = "Feels like "+Math.round(c.apparent_temperature)+"°";
  $("sunriseT").textContent = to12(W.daily.sunrise[0]);
  $("sunsetT").textContent = to12(W.daily.sunset[0]);
  var p = W.daily.moon_phase[0];
  $("moonIcon").innerHTML = moonSVG(p);
  $("moonName").textContent = moonName(p);
  var lit = Math.round((1-Math.cos(2*Math.PI*p))/2*100);
  $("moonRise").textContent = W.daily.moonrise[0] ? "Rise " + to12(W.daily.moonrise[0]) : "";
  $("moonLit").textContent = lit + "% lit";
}

/* ============ canvas scene engine ============ */
function grp(c){ if (c<=1) return "clear"; if (c<=3) return "cloudy"; if (c<=48) return "fog"; if (c<=57) return "drizzle"; if (c<=67||c<=82) return "rain"; if (c<=86) return "snow"; return "storm"; }

var Scene = (function(){
  var cv = null, ctx = null, Wc = 1280, Hc = 800;
  var running = false, rafId = 0, last = 0, acc = 0, t = 0;
  var weather = null, night = true, nightApplied = true;
  var clouds = [], rainP = [], snowP = [], stars = [], ripples = [], gulls = [];
  var flash = 0, flashNext = 8, bolt = null;
  var shoot = null, shootNext = 14;
  var gullNext = 9;
  var rippleT = 0;
  var HORIZON = 0.60;

  function mix(a,b,f){ return [a[0]+(b[0]-a[0])*f, a[1]+(b[1]-a[1])*f, a[2]+(b[2]-a[2])*f]; }
  function rgb(c,a){ return "rgba("+Math.round(c[0])+","+Math.round(c[1])+","+Math.round(c[2])+","+(a===undefined?1:a)+")"; }
  function hx(h){ return [parseInt(h.substr(1,2),16), parseInt(h.substr(3,2),16), parseInt(h.substr(5,2),16)]; }
  function blendP(a,b,f){ return { top:mix(a.top,b.top,f), mid:mix(a.mid,b.mid,f), hor:mix(a.hor,b.hor,f) }; }

  var PAL = {
    dawn:    { top:hx("#2c3e6b"), mid:hx("#8a6a8f"), hor:hx("#f4a259") },
    morning: { top:hx("#3a7bc8"), mid:hx("#7db4de"), hor:hx("#cfe6f5") },
    midday:  { top:hx("#2f6db8"), mid:hx("#6fa8d8"), hor:hx("#c9e2f2") },
    golden:  { top:hx("#3d5a80"), mid:hx("#c98a6b"), hor:hx("#ffb26b") },
    sunset:  { top:hx("#2b2a55"), mid:hx("#8a4a6e"), hor:hx("#ff9d5c") },
    deep:    { top:hx("#191a33"), mid:hx("#33315c"), hor:hx("#5a4468") },
    late:    { top:hx("#0d1020"), mid:hx("#1c1f38"), hor:hx("#33284a") },
    overcast:{ top:hx("#5e6a78"), mid:hx("#8b97a2"), hor:hx("#b4bdc4") },
    fog:     { top:hx("#98a1a8"), mid:hx("#b8bfc4"), hor:hx("#d3d8db") },
    snow:    { top:hx("#8b96a5"), mid:hx("#b9c1cb"), hor:hx("#dfe4e9") },
    rain:    { top:hx("#3a4552"), mid:hx("#5c6875"), hor:hx("#8b95a0") }
  };

  function skyPal(now){
    var g = grp(weather && weather.current ? weather.current.weather_code : 3);
    if (g !== "clear") return (g==="fog")?PAL.fog:(g==="snow")?PAL.snow:(g==="rain"||g==="storm")?PAL.rain:PAL.overcast;
    if (!weather || !weather.daily) return PAL.midday;
    var rise = new Date(weather.daily.sunrise[0]).getTime();
    var set  = new Date(weather.daily.sunset[0]).getTime();
    var n = now.getTime();
    var duskEnd = set + S.sunsetOffset*60000;
    if (n < rise) return PAL.dawn;
    if (n <= set){
      var p = (n - rise)/(set - rise);
      if (p<0.15) return blendP(PAL.dawn, PAL.morning, p/0.15);
      if (p<0.4)  return blendP(PAL.morning, PAL.midday, (p-0.15)/0.25);
      if (p<0.72) return PAL.midday;
      if (p<0.9)  return blendP(PAL.midday, PAL.golden, (p-0.72)/0.18);
      return blendP(PAL.golden, PAL.sunset, (p-0.9)/0.1);
    }
    if (n <= duskEnd){
      var q = (n - set)/(duskEnd - set);
      if (q<0.5) return blendP(PAL.sunset, PAL.deep, q/0.5);
      return blendP(PAL.deep, PAL.late, (q-0.5)/0.5);
    }
    return PAL.late;
  }

  function makeClouds(){
    clouds = [];
    var layers = [{n:4,s:.5,a:.42,dy:.06},{n:4,s:1,a:.62,dy:.16},{n:3,s:1.6,a:.82,dy:.30}];
    for (var L=0;L<layers.length;L++){
      var ly = layers[L];
      for (var i=0;i<ly.n;i++){
        var puffs = [];

    var n = now.getTime();
    var g = grp(weather.current.weather_code);
    if (g !== "clear") return null;

      var p = (n - rise)/(set - rise);
      return { x:(0.08+p*0.84)*Wc, y:Hc*(0.62 - Math.sin(p*Math.PI)*0.48), up:true, p:p };
    }
    var duskEnd = set + S.sunsetOffset*60000;
    if (n > set && n <= duskEnd){
      var fd = (n - set)/(duskEnd - set);
      return { x:(0.92+fd*0.16)*Wc, y:Hc*(0.60+fd*0.30), up:fd<0.55, setting:true };
    }
    return null;
  }

    if (!sp || !sp.up) return;
    if (g!=="clear" && g!=="cloudy") return;
    var golden = Math.max(0, Math.min(1, (0.85-elev)/0.55));
    if (golden <= 0.02) return;
    var inten = golden*0.9;
    ctx.save(); ctx.globalCompositeOperation = "lighter";
    ctx.translate(sp.x, sp.y);
    var baseA = Math.atan2(Hc*0.55 - sp.y, Wc*0.45 - sp.x);
    for (var i=0;i<6;i++){
      var a = baseA + (i-2.5)*0.17 + Math.sin(t*0.05+i)*0.015;
      var len = Hc*1.3;
      var rg = ctx.createLinearGradient(0,0, Math.cos(a)*len, Math.sin(a)*len);
      rg.addColorStop(0, "rgba(255,222,150,"+(0.11*inten)+")");
      rg.addColorStop(1, "rgba(255,222,150,0)");
      ctx.fillStyle = rg;
      ctx.beginPath(); ctx.moveTo(0,0);
      ctx.lineTo(Math.cos(a+0.055)*len, Math.sin(a+0.055)*len);
      ctx.lineTo(Math.cos(a-0.055)*len, Math.sin(a-0.055)*len);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }
  function drawHaze(pal){
    var horY = Hc*HORIZON;
    var g2 = ctx.createLinearGradient(0, horY-110, 0, horY);
    g2.addColorStop(0, "rgba(232,240,248,0)");
    g2.addColorStop(1, rgb(pal.hor, 0.26));
    ctx.fillStyle = g2; ctx.fillRect(0, horY-110, Wc, 110);
  }
  function drawGrade(elev){
    var warm = Math.max(0, 1-elev*1.3);
    ctx.save(); ctx.globalCompositeOperation = "soft-light"; ctx.globalAlpha = 0.4;
    var g2 = ctx.createLinearGradient(0,0,0,Hc);
    g2.addColorStop(0, rgb(mix([40,80,140],[70,60,115],warm)));
    g2.addColorStop(1, rgb(mix([120,160,210],[255,150,80],warm)));
    ctx.fillStyle = g2; ctx.fillRect(0,0,Wc,Hc);
    ctx.restore();
  }
  function stripTint(now, pal){
    var sec = Math.floor(now.getTime()/2000);
    if (sec !== lastStripSec){
      lastStripSec = sec;
      var stEl = document.getElementById("strip");
      if (stEl){
        if (night){ if (!nightStyled){ stEl.style.background = ""; nightStyled = true; } }
        else {
          nightStyled = false;
          stEl.style.background = "linear-gradient(180deg,"+rgb(mix(pal.mid,[8,18,32],0.55),0.30)+" 0%,"+rgb(mix(pal.hor,[5,12,25],0.55),0.14)+" 100%)";
        }
      }
    }
  }
  function render(){
    if (!ctx) return;
    var now = new Date();
    var pal = skyPal(now);
    var c = weather ? weather.current : null;
    var g = grp(c ? c.weather_code : 3);
    var isDay = c ? c.is_day===1 : true;
    var elev = 0;
    var rise = weather&&weather.daily ? new Date(weather.daily.sunrise[0]).getTime() : null;
    var set = weather&&weather.daily ? new Date(weather.daily.sunset[0]).getTime() : null;
    var n = now.getTime();
    if (rise && set && n>=rise && n<=set) elev = Math.sin(((n-rise)/(set-rise))*Math.PI);
    var sp = sunPos(now), mp = moonPos(now);
    drawSky(pal);
    var duskF = 0;
    if (set){
      var duskEnd = set + S.sunsetOffset*60000;
      if (n > set) duskF = Math.min(1, (n-set)/(duskEnd-set));
    }
    drawStars(duskF*0.9);
    drawShooting(1/30);
    drawSun(sp, elev, pal);
    drawMoon(mp);
    var alphaMul = (g==="rain"||g==="storm") ? 0.9 : (g==="cloudy") ? 0.85 : (g==="snow") ? 0.7 : (g==="fog") ? 0.4 : 0.75;
    var maxN = (g==="clear") ? 5 : (g==="fog") ? 2 : 11;
    var tint = (g==="rain"||g==="storm") ? [52,62,78] : (g==="snow") ? [225,232,240] : mix([252,253,255], pal.mid, 0.18);
    drawClouds(1/30, sp?sp.x:null, elev, g, tint, alphaMul, maxN);
    drawHaze(pal);
    var wind = c ? c.wind_speed_10m : 4;
    if (g==="rain"||g==="drizzle"||g==="storm") drawRain(1/30, wind);
    if (g==="snow") drawSnow(1/30);
    if (g==="fog") drawFog();
    var glitterX = -1, glitterCol = [255,230,170], glitterI = 0;
    if (sp && sp.up){ glitterX = sp.x; glitterCol = [255,232,175]; glitterI = (g==="clear")?1:(g==="cloudy")?0.35:0.15; }
    else if (mp){ glitterX = mp.x; glitterCol = [205,220,240]; glitterI = (g==="clear")?0.8:0.25; }
    drawSea(pal, elev, glitterX, glitterCol, glitterI);
    drawRipples(1/30);
    if (g==="storm") drawLightning(1/30);
    drawGulls(1/30);
    drawRays(sp, elev, g);
    drawPilings();
    drawLighthouse(pal);
    drawGrade(elev);
    stripTint(now, pal);
  }

  function frame(ts){
    rafId = requestAnimationFrame(frame);
    if (!last) last = ts;
    var dt = Math.min(0.05, (ts-last)/1000); last = ts;
    acc += dt; if (acc < 1/31) return;
    var step = acc; acc = 0;
    update(step); render();
  }

  function start(){ if (!running){ running = true; last = 0; acc = 0; rafId = requestAnimationFrame(frame); } }
  function stop(){ if (rafId){ cancelAnimationFrame(rafId); rafId = 0; } running = false; }

  return {
    init: function(){
      if (cv) return;
      cv = document.getElementById("scene");
      Wc = cv.width = window.innerWidth;
      Hc = cv.height = window.innerHeight;
      ctx = cv.getContext("2d");
      makeClouds(); makeStars(); makeRain(); makeSnow();
    },
    update: function(w){ weather = w; this.init(); makeRain(); },
    setNight: function(n){
      night = n;
      if (n) stop(); else { this.init(); start(); }
    }
  };
})();

/* ============ tides: wave ============ */
var T = null;
function fetchTides(){
  var d = new Date();
  var begin = new Date(d.getTime()-36*3600*1000), end = new Date(d.getTime()+24*3600*1000);
  var f = function(x){ return x.getFullYear()+"-"+("0"+(x.getMonth()+1)).slice(-2)+"-"+("0"+x.getDate()).slice(-2); };
  var u = "https://api.tidesandcurrents.noaa.gov/api/prod/datagetter?product=predictions&application=frame"
    +"&begin_date="+f(begin)+"&end_date="+f(end)
    +"&station="+S.tideStation+"&datum=MLLW&time_zone=lst_ldt&units=english&interval=hilo&format=json";
  fetch(u).then(function(r){ return r.json(); }).then(function(j){
    if (!j.predictions) return;
    T = j.predictions.map(function(e){ return { t:new Date(e.t.replace(" ","T")), high:e.type==="H", v:+e.v }; });
    renderTides();
  }).catch(function(){});
}
function renderTides(){
  var el = $("tideWave"), cap = $("tideCap");
  if (!T || !T.length){ return; }
  var now = Date.now();
  var i = 0; while (i<T.length && T[i].t.getTime()<now) i++;
  var prev = T[i-1], next = T[i], after = T[i+1];
  if (!prev){ prev = { t:new Date(now-6*3600*1000), high:!next.high, v: next ? (next.high? next.v-4 : next.v+4) : 0 }; }
  if (!next) return;
  var w0 = now-3*3600*1000, w1 = now+9*3600*1000, w = w1-w0;
  var Wpx = 1000, Hpx = 200;
  var pts = [];
  var startIdx = i-1;
  while (startIdx > 0 && T[startIdx].t.getTime() > w0) startIdx--;
  for (var k = startIdx; k<T.length; k++){ if (T[k].t.getTime() <= w1) pts.push(T[k]); else break; }
  while (pts.length && pts[0].t.getTime() > w0 && startIdx > 0){ startIdx--; pts.unshift(T[startIdx]); }
  while (pts.length >= 2 && pts[pts.length-1].t.getTime() < w1){
    var A = pts[pts.length-1], B = pts[pts.length-2];
    var span = A.t.getTime() - B.t.getTime();
    pts.push({ t:new Date(A.t.getTime()+span), high:!A.high, v: B.v + (A.v - B.v)*.15 });
  }
  if (pts.length<2){ pts = [prev,next]; }
  function yAt(x){
    for (var j=0;j<pts.length-1;j++){
      var a=pts[j], b=pts[j+1];
      if (x>=a.t.getTime() && x<=b.t.getTime()){
        var f=(x-a.t.getTime())/((b.t.getTime()-a.t.getTime())||1);
        var mid=(a.v+b.v)/2, amp=Math.abs(b.v-a.v)/2;
        return mid + (a.high ? amp*Math.cos(Math.PI*f) : -amp*Math.cos(Math.PI*f));
      }
    }
    return null;
  }
  var path="", first=true, ptsSvg=[];
  for (var s=0;s<=80;s++){
    var x = w0 + w*s/80; var y = yAt(x);
    if (y===null) continue;
    ptsSvg.push([x,y]);
  }
  if (!ptsSvg.length) return;
  var vs = ptsSvg.map(function(p){ return p[1]; });
  var vmin = Math.min.apply(null,vs), vmax = Math.max.apply(null,vs);
  var pad = Math.max((vmax-vmin)*.15, .2);
  vmin-=pad; vmax+=pad;
  function X(x){ return ((x-w0)/w*Wpx).toFixed(1); }
  function Y(v){ return (Hpx - (v-vmin)/(vmax-vmin)*(Hpx-20) - 10).toFixed(1); }
  ptsSvg.forEach(function(p,idx){
    path += (first ? "M" : "L")+" "+X(p[0])+" "+Y(p[1])+" ";
    first=false;
  });
  var areaPath = path + " L "+X(ptsSvg[ptsSvg.length-1][0])+" "+Hpx+" L "+X(ptsSvg[0][0])+" "+Hpx+" Z";
  var my = yAt(now);
  var mx = X(now), myY = Y(my);
  var rising = next.high;
  function h12(d2){ var hh=d2.getHours()%12||12, mm2=("0"+d2.getMinutes()).slice(-2); return hh+":"+mm2+(d2.getHours()<12?"a":"p"); }
  var svg = '<svg viewBox="0 0 '+Wpx+' '+Hpx+'" preserveAspectRatio="none" style="width:100%;height:100%">'
    + '<defs><linearGradient id="tg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="rgba(143,210,255,.35)"/><stop offset="1" stop-color="rgba(143,210,255,0)"/></linearGradient></defs>'
    + '<path d="'+areaPath+'" fill="url(#tg)"/>'
    + '<path d="'+path+'" fill="none" stroke="#8fd2ff" stroke-width="5" stroke-linecap="round"/>'
    + '<line x1="'+mx+'" y1="0" x2="'+mx+'" y2="'+Hpx+'" stroke="rgba(255,255,255,.25)" stroke-width="2" stroke-dasharray="6 8"/>'
    + '<circle cx="'+mx+'" cy="'+myY+'" r="13" fill="#fff"/>'
    + '</svg>';
  var marks = "";
  for (var m2=0;m2<pts.length;m2++){
    var ev = pts[m2];
    if (ev.t.getTime() < w0 || ev.t.getTime() > w1) continue;
    var ex = X(ev.t.getTime()), ey = Y(ev.v);
    var ly = ev.high ? (ey-20) : (ey+46);
    marks += '<circle cx="'+ex+'" cy="'+ey+'" r="6" fill="rgba(255,255,255,.9)"/>'
           + '<text x="'+ex+'" y="'+ly+'" font-size="32" font-family="Jost" fill="rgba(255,255,255,.85)" text-anchor="middle">'+(ev.high?"H":"L")+'</text>';
  }
  svg = svg.replace("</svg>", marks + "</svg>");
  el.innerHTML = svg;
  cap.innerHTML = '<span>'+(rising?"Rising":"Falling")+'</span><span class="dim"> · </span>'
    + '<span>Next '+(next.high?"High":"Low")+' <span class="next">'+h12(next.t)+" ("+Math.abs(next.v).toFixed(1)+' ft)</span></span>';
  if (after) cap.title = "then "+((after.high)?"High":"Low")+" "+h12(after.t);
}

/* ============ schedule / night ============ */
function parseHM(s){ var p=s.split(":"); return {h:+p[0], m:+p[1]}; }
function isNight(d){
  if (S.mode==="off") return false;
  if (S.mode==="fixed"){ var a=parseHM(S.dayStart), b=parseHM(S.dayEnd), m=d.getHours()*60+d.getMinutes(); return !(m>=a.h*60+a.m && m<b.h*60+b.m); }
  if (W && W.daily){
    var rise=new Date(W.daily.sunrise[0]).getTime()-S.sunriseOffset*60000;
    var set=new Date(W.daily.sunset[0]).getTime()+S.sunsetOffset*60000;
    var n=d.getTime(); return !(n>=rise && n<set);
  }
  return false;
}

/* ============ clock ============ */
var lastDigits="";
function renderClock(){
  var d=new Date(); var h=d.getHours()%12||12; var mm=("0"+d.getMinutes()).slice(-2);
  var s=("0"+h).slice(-2)+mm;
  var ampm = d.getHours()<12?"AM":"PM";
  $("time").innerHTML = (h+":"+mm)+"<small>"+ampm+"</small>";
  $("date").textContent = d.toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"});
  if (s!==lastDigits){
    var fc=$("flipClock"); var parts=[s[0],s[1],":",s[2],s[3]];
    if (fc.children.length!==6){ fc.innerHTML=""; parts.forEach(function(p){ var e=document.createElement("div"); e.className = p===":" ? "fcolon" : "fdigit"; e.textContent=p; fc.appendChild(e); }); var ap=document.createElement("div"); ap.id="fampm"; ap.textContent=ampm; fc.appendChild(ap); }
    else { parts.forEach(function(p,i){ var e=fc.children[i]; if (e.textContent!==p){ e.textContent=p; e.classList.remove("flip"); void e.offsetWidth; e.classList.add("flip"); } }); fc.children[5].textContent=ampm; }
    lastDigits=s;
  }
  if (W) $("nightTemp").textContent = Math.round(W.current.temperature_2m)+"°F";
}
setInterval(renderClock,1000);
setInterval(function(){ if (T) renderTides(); }, 120000);

function tick(){
  var d=new Date();
  Scene.setNight(isNight(d));
  document.body.classList.toggle("night", isNight(d));
}
setInterval(tick, 20000);

/* ============ music ============ */
var audio=null;
$("music").addEventListener("click", function(){
  if (!S.stream) return;
  if (audio && !audio.paused){ audio.pause(); $("music").style.color="rgba(255,255,255,.5)"; return; }
  if (!audio){ audio=new Audio(); audio.src=S.stream; audio.volume=.6; }
  audio.play(); $("music").style.color="#8fd2ff";
});

/* ============ settings ============ */
$("settingsGear").addEventListener("click", function(){
  $("sMode").value=S.mode; $("sDayStart").value=S.dayStart; $("sDayEnd").value=S.dayEnd;
  $("sSunsetOffset").value=S.sunsetOffset; $("sLat").value=S.lat; $("sLon").value=S.lon;
  $("sTideStation").value=S.tideStation; $("sStream").value=S.stream;
  $("panel").classList.add("open");
});
$("panel").querySelector(".close").addEventListener("click", function(){ $("panel").classList.remove("open"); });
$("sSave").addEventListener("click", function(){
  S.mode=$("sMode").value; S.dayStart=$("sDayStart").value||"07:00"; S.dayEnd=$("sDayEnd").value||"20:00";
  S.sunsetOffset=+$("sSunsetOffset").value||0; S.lat=$("sLat").value; S.lon=$("sLon").value;
  S.tideStation=$("sTideStation").value.trim(); S.stream=$("sStream").value.trim();
  save(); $("panel").classList.remove("open"); $("music").style.display = S.stream ? "flex" : "none"; T=null; fetchWx(); fetchTides(); tick();
});

/* ============ boot ============ */
if (S.stream) $("music").style.display = "flex";
Scene.init();
renderClock(); tick(); fetchWx(); fetchTides();
setInterval(fetchWx, 20*60*1000); setInterval(fetchTides, 60*60*1000);
(function(){ var d=new Date(), n=new Date(d); n.setHours(4,0,0,0); if (n<=d) n.setDate(n.getDate()+1); setTimeout(function(){ location.reload(); }, n-d); })();
</script>
